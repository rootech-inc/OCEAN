{% extends 'employee/emp_base.html' %}
{% load static %}
{% block body %}
<!-- Monthly Attendance Header -->
<div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
    <div>
        <h4 class="fw-bold mb-1">Monthly Summary</h4>
        <p class="text-muted small mb-0">Review aggregated attendance records for the current month.</p>
    </div>
    <div class="d-flex align-items-center gap-2">
        <input id="month_picker" type="month" class="form-control form-control-sm" style="width: 180px;">
        <button class="btn btn-sm btn-outline-primary d-flex align-items-center gap-2" id="export_attendance">
            <i class="bi bi-download"></i>
            <span>Export</span>
        </button>
    </div>
</div>

<!-- Attendance Table Section -->
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div id="table-container" class="table-responsive">
            <table class="table table-hover mb-0 w-100" id="table">
                <thead>
                    <tr>
                        <th>Employee Name</th>
                        <th>Department</th>
                        <th>Total Late</th>
                        <th>Late Absent</th>
                        <th>Absents</th>
                        <th>Total Absent</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="att_bd">
                    <tr>
                        <td colspan="7" class="text-center py-5">
                            <div class="spinner-border text-primary spinner-border-sm" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <div class="mt-2 text-muted small">Loading monthly data...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<style>
    #table thead th {
        background-color: var(--hr-bg);
        color: var(--hr-text-muted);
        font-weight: 600;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-top: none;
        padding: 12px 16px;
    }

    #table tbody td {
        padding: 14px 16px;
        vertical-align: middle;
        font-size: 13.5px;
        border-bottom: 1px solid var(--hr-border);
    }

    #table tbody tr:last-child td {
        border-bottom: none;
    }

    /* DataTable customization */
    .dataTables_wrapper .dataTables_filter {
        padding: 16px;
    }

    .dataTables_wrapper .dataTables_info {
        padding: 16px;
        font-size: 12px;
    }

    .dataTables_wrapper .dataTables_paginate {
        padding: 16px;
    }
</style>

<script>
    $(document).ready(function () {
        const currentDate = new Date();
        const month = String(currentDate.getMonth() + 1).padStart(2, '0');
        const year = currentDate.getFullYear();
        const dateStr = `${year}-${month}`;

        $('#month_picker').val(dateStr);

        staff.loadMonthlyAttendance(dateStr);

        $('#month_picker').change(function () {
            const selectedMonth = $(this).val();
            // Clear and reload
            $('#att_bd').html(`
                <tr>
                    <td colspan="7" class="text-center py-5">
                        <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                        <div class="mt-2 text-muted small">Loading data for ${selectedMonth}...</div>
                    </td>
                </tr>
            `);
            staff.loadMonthlyAttendance(selectedMonth);
        });
    });
</script>
{% endblock %}
