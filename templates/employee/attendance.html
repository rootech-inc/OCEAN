{% extends 'employee/emp_base.html' %}
{% load static %}

{% block body %}
<!-- Attendance Header -->
<div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
    <div>
        <h4 class="fw-bold mb-1">Daily Attendance</h4>
        <p class="text-muted small mb-0">Monitor and manage employee daily presence records.</p>
    </div>
    <div class="d-flex align-items-center gap-2">
        <div class="input-group input-group-sm">
            <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-calendar3 text-muted"></i>
            </span>
            <input id="attd_date" type="date" class="form-control border-start-0 ps-0" style="width: 150px;">
        </div>
        <button class="btn btn-sm btn-outline-primary d-flex align-items-center gap-2" id="exp_attendance">
            <i class="bi bi-download"></i>
            <span>Export</span>
        </button>
    </div>
</div>

<!-- Attendance Summary Cards -->
<div class="row g-3 mb-4">


    <div class="col-12">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-3">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <div class="flex-shrink-0 rounded-3 bg-primary-subtle text-primary d-flex align-items-center justify-content-center"
                        style="width: 32px; height: 32px;">
                        <i class="bi bi-geo-alt-fill"></i>
                    </div>
                    <h6 class="fw-bold mb-0">Location-wise Breakdown</h6>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm table-borderless align-middle mb-0">
                        <thead class="text-muted small uppercase border-bottom">
                            <tr>
                                <th class="pb-2">Location</th>
                                <th class="pb-2">Staffs</th>
                                <th class="text-center pb-2">Present</th>
                                <th class="text-center pb-2">Absent</th>
                                <th class="text-center pb-2">Precent %</th>
                            </tr>
                        </thead>
                        <tbody id="location-wise-stats">

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>



    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-3 d-flex align-items-center gap-3">
                <div class="flex-shrink-0 rounded-3 bg-success-subtle text-success d-flex align-items-center justify-content-center"
                    style="width: 48px; height: 48px;">
                    <i class="bi bi-check-circle-fill fs-5"></i>
                </div>
                <div>
                    <span class="d-block text-muted small fw-medium uppercase">On Time</span>
                    <h4 class="fw-bold mb-0 text-dark" id="ontime-count">0</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-3 d-flex align-items-center gap-3">
                <div class="flex-shrink-0 rounded-3 bg-warning-subtle text-warning d-flex align-items-center justify-content-center"
                    style="width: 48px; height: 48px;">
                    <i class="bi bi-clock-fill fs-5"></i>
                </div>
                <div>
                    <span class="d-block text-muted small fw-medium uppercase">Late</span>
                    <h4 class="fw-bold mb-0 text-dark" id="late-count">0</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-3 d-flex align-items-center gap-3">
                <div class="flex-shrink-0 rounded-3 bg-danger-subtle text-danger d-flex align-items-center justify-content-center"
                    style="width: 48px; height: 48px;">
                    <i class="bi bi-x-circle-fill fs-5"></i>
                </div>
                <div>
                    <span class="d-block text-muted small fw-medium uppercase">Absent</span>
                    <h4 class="fw-bold mb-0 text-dark" id="absent-count">0</h4>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Attendance Table Section -->
<div class="card border-0 shadow-sm">
    <div class="card-body p-2">
        <div id="x_start" class="table-responsive">
            <div class="p-5 text-center text-muted">
                <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                Initializing records...
            </div>
        </div>
    </div>
</div>

<style>
    .uppercase {
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    #attd_table thead th {
        background-color: var(--hr-bg);
        color: var(--hr-text-muted);
        font-weight: 600;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-top: none;
        padding: 12px 16px;
    }

    #attd_table tbody td {
        padding: 14px 16px;
        vertical-align: middle;
        font-size: 13.5px;
        border-bottom: 1px solid var(--hr-border);
    }

    #attd_table tbody tr:last-child td {
        border-bottom: none;
    }

    /* DataTable customization */
    .dataTables_wrapper .dataTables_filter {
        padding: 16px;
    }

    .dataTables_wrapper .dataTables_info {
        padding: 16px;
        font-size: 12px;
    }

    .dataTables_wrapper .dataTables_paginate {
        padding: 16px;
    }

    .badge-status {
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 500;
    }
</style>

<script>
    // Define the table structure
    const tableTemplate = `
        <table id="attd_table" class="table table-hover mb-0 w-100">
            <thead>
                <tr>
                    <th>Employee Name</th>
                    <th>Area</th>
                    <th>Department</th>
                    <th>Position</th>
                    <th>Status</th>
                    <th>Time In</th>
                    <th>Time Out</th>
                </tr>
            </thead>
            <tbody id="att_bd">
                <tr class="loading-row">
                    <td colspan="6" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <div class="mt-2 text-muted small">Fetching attendance data...</div>
                    </td>
                </tr>
            </tbody>
        </table>
    `;

    $(document).ready(function () {
        // Initial setup
        $('#x_start').html(tableTemplate);

        // Set default date to today
        const today = new Date().toISOString().split('T')[0];
        $('#attd_date').val(today);

        // Load attendance for today
        staff.loadAttendance(today);

        // Handle date change
        $('#attd_date').change(function () {
            const selectedDate = $(this).val();
            $('#x_start').empty().html(tableTemplate);
            staff.loadAttendance(selectedDate);
        });
    });

    // We need to override the staff.loadAttendance slightly to handle our new status badges
    // but the original function uses classes like text-success/text-warning/text-danger
    // which our CSS should handle or we can patch the function in this page context.

</script>
{% endblock %}
