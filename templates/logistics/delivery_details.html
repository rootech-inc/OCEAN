{% extends 'logistics/base.html' %}
{% load static %}

{% block body %}

    <div style="max-height: 100%; overflow: hidden" class="overflow-auto">
        <div class="card">
        <div class="card-header">
            <div class="w-100 d-flex flex-wrap">
                <div class="w-50">
                    <button class="btn btn-warning record_purchase"><i class="fa fa-gas-pump"></i></button>
                </div>

                <div class="w-50 d-flex flex-wrap justify-content-end bt">

                </div>
            </div>


        </div>
        <div class="card-body p-2">
            <div class="d-flex flex-wrap align-items-center justify-content-between">
                <small class="text-danger float-left source">
                    <div class="spinner-border" role="status">
                  <span class="sr-only">Loading...</span>
                </div>

                </small>

                <small class="text-warning">>>>>>>>>>>></small>

                <small class="text-info destination float-right">
                <div class="spinner-border" role="status">
                  <span class="sr-only">Loading...</span>
                </div>
            </small>
            </div>
            <p class="text-justify description mt-2">

            </p>


            <hr>
            <div class="container my-4">
                  <div class="d-flex flex-column position-relative logs" style="border-left: 3px solid #28a745; margin-left: 20px; padding-left: 20px;">

                  </div>
            </div>
        </div>
    </div>


    </div>

    <script>
        $(document).ready(function () {
            let enc = `{{ enc }}`
            let car_pk = `{{car_pk}}`

            

            logistics.LoadDeliveryDetails(enc)


                    $('.record_purchase').click(function(){
                        let body = "";
                        body += fom.number('amount','how much purchase?',true)
                        body += fom.number('rate','price per lt',true)
                        body +=  `
                            <form id="snd_rep" method='post' enctype="multipart/form-data" action="/logistic/fuel-reciept/" >
                             <input type="hidden" name="block" id="block">
                            <input type="file" name="receipt" class="form-control" id="receipt"></form>
                        `

                        amodal.setTitleText("NEW RECORD")
                        amodal.setBodyHtml(body)
                        amodal.setSize('L')
                        amodal.show()
                        amodal.setFooterHtml(`<button class="btn btn-primary" id="save_fuel">SAVE</button>`)
                        amodal.show()

                        $('#save_fuel').click(async function(){
                            let ids = ['amount','rate','mypk','receipt']
                            if(anton.validateInputs(ids)){
                                let payload = {
                                    module:'fuel_purchase',
                                    data:anton.Inputs(ids)
                                }

                                payload['data']['pk'] = car_pk
                                payload['data']['trip_enc'] = enc

                                await api.v2('PUT',payload,logistics.interface).then(response => {
                                    if(anton.IsRequest(response)){
                                        $('#block').val(response.message)
                                        $('#snd_rep').submit()
                                    } else {
                                        kasa.response(response)
                                    }
                                })

                            }
                        })

                    })
        })
    </script>

{% endblock %}
