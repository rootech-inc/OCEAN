{% extends 'logistics/base.html' %}
{% load static %}


{% block body %}
    <style>
        #new_fleet {
            position: fixed !important;
            bottom: 20px !important;
            right: 20px !important;
            z-index: 2000;
        }
    </style>
    <button id="new_fleet" style="width: 40px; height: 40px;" class="btn btn-info p-0 rounded-circle shadow">
    +
    </button>
    <div class="container mt-4 h-100 overflow-auto">
        <div class="card">

            <div class="card-header">
                <div class="w-100 d-flex">
                    <div class="w-50 d-flex">
                        <button class="btn btn-info rounded-0 ms-2" id="previous"><i class="fa fa-fast-backward"></i></button>
                        <button class="btn btn-info rounded-0 ms-2" id="next"><i class="fa fa-fast-forward"></i></button>
                    </div>
                    <div class="w-50 d-flex justify-content-end">
                        <div class="dropdown">
                            <button class="btn btn-secondary dropdown-toggle" type="button" id="statusDropdown"
                                    data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                Menu
                            </button>
                            <div class="dropdown-menu" aria-labelledby="statusDropdown">
                                <a class="dropdown-item" id="fuel" href="javascript:void(0)">Fuel History</a>
                                <a class="dropdown-item" id="trips" href="javascript:void(0)">Trips</a>
                                <a class="dropdown-item" id="service_history" href="javascript:void(0)">Service History</a>
                                <a class="dropdown-item" id="compliance" disabled="" href="javascript:void(0)">Compliance</a>
                                <a class="dropdown-item" id="images" disabled="" href="javascript:void(0)">Images</a>
                                <a class="dropdown-item" id="logs" disabled="" href="javascript:void(0)">Logs</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-body p-2">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-4">
                            <div class="row d-flex align-items-center mb-2">
                                <label for="plate_number" class="col-sm-4">ASSET No.</label>
                                <div class="col-sm-8">
                                    <input type="hidden" id="pk">
                                    <input type="text" readonly id="plate_number" class="form-control rounded-0">
                                </div>
                            </div>
                            <!-- MANUFACTURER -->
                            <div class="row d-flex align-items-center mb-2">
                                <label for="manufacturer" class="col-sm-4">Manufacturer</label>
                                <div class="col-sm-8">
                                    <input type="text" readonly id="manufacturer" class="form-control rounded-0">
                                </div>
                            </div>

                            <!-- MODEL -->
                            <div class="row d-flex align-items-center mb-2">
                                <label for="model" class="col-sm-4">Model</label>
                                <div class="col-sm-8">
                                    <input type="text" readonly id="model" class="form-control rounded-0">
                                </div>
                            </div>

                            <!-- CHASIS -->
                            <div class="row d-flex align-items-center mb-2">
                                <label for="chassis" class="col-sm-4">Chassis</label>
                                <div class="col-sm-8">
                                    <input type="text" readonly id="chassis" class="form-control rounded-0">
                                </div>
                            </div>

                        </div>

                        <div class="col-sm-4">
                            <!-- TYPE -->
                            <div class="row d-flex align-items-center mb-2">
                                <label for="type" class="col-sm-4">Type</label>
                                <div class="col-sm-8">
                                    <input type="text" readonly id="type" class="form-control rounded-0">
                                </div>
                            </div>

                            <!-- FUEL -->
                            <div class="row d-flex align-items-center mb-2">
                                <label for="fuel_type" class="col-sm-4">Fuel</label>
                                <div class="col-sm-8">
                                    <input type="text" readonly id="fuel_type" class="form-control rounded-0">
                                </div>
                            </div>

                            <!-- CAPACITY -->
                            <div class="row d-flex align-items-center mb-2">
                                <label for="capacity" class="col-sm-4">Capacity</label>
                                <div class="col-sm-8">
                                    <input type="text" readonly id="capacity" class="form-control rounded-0">
                                </div>
                            </div>

                            <!-- YEAR -->
                            <div class="row d-flex align-items-center mb-2">
                                <label for="make_year" class="col-sm-4">Year</label>
                                <div class="col-sm-8">
                                    <input type="text" readonly id="make_year" class="form-control rounded-0">
                                </div>
                            </div>

                        </div>

                        <div class="col-sm-4">
                            <img src="" id="img" alt="" class="img-fluid img-thumbnail">
                        </div>

                        

                    </div>
                </div>
            </div>
        </div>


    </div>

    <script>
        $(document).ready(function(){

                let fh = true;
                let arr = []
                {#logistics.loadFleets()#}
                logistics.loadFleet(`{{ last_fleet_pk }}`)
                $('#previous').click(function(){
                    let pk = $(this).data('pk')
                    logistics.loadFleet(pk)
                })

                $('#next').click(function(){
                    let pk = $(this).data('pk')
                    logistics.loadFleet(pk)
                })

                $('#img').click(function(){
                    let img = $('#img').attr('src')
                    if(img.length > 0){
                        anton.viewFile(img,"Car Image")
                    }
                })

                $('#new_fleet').click(function(){

                    let h1 = ``

                    let h2 = ""

                    h1 += fom.text('plate_number','',true)
                    h1 += fom.text('description','',true)
                    h1 += fom.number('capacity','in KG',true)
                    h1 += fom.number('make_year','',true)
                    h2 += fom.selectv2('manufacturer',[
                        {val:'toyota',desc:'Toyota'},
                        {val:'honda',desc:'Honda'},
                        {val:'ford',desc:'Ford'},
                        {val:'bmw',desc:'BMW'},
                        {val:'nissan',desc:'Nissan'},
                        {val:'hyundai',desc:'Hyundai'},
                        {val:'kia',desc:'Kia'},
                        {val:'mazda',desc:'Mazda'},
                        {val:'mitsubishi',desc:'Mitsubishi'},
                        {val:'tata',desc:'Tata'},
                        {val:'others',desc:'Others'},
                    ],'')
                    h2 += fom.text('model','',true)
                    h2 += fom.text('chassis','',true)
                    h2 += fom.selectv2('fuel_type',[{val:'petrol',desc:"Petrol"},{val:'diesel',desc:"Diesel"},{val:'electric',desc:"Electric"},{val:'hybrid',desc:"Hybrid"},{val:'others',desc:"Others"}])



                    let form = `
                        <div class='container'>
                            <div class="row">
                                <div class="col-sm-6">${h1}</div>
                                <div class="col-sm-6">${h2}</div>
                            </div>
                        </div>
                    `

                    form += `
                        <form method="POST" action="/logistic/upload-fleet-image/" enctype="multipart/form-data" id="update_fleet_car">
                            <h3>Images</h3>
                            <div class="input-group card p-2 mb-2">
                                <input type="hidden" id="fleet_id" name="fleet_id" value="">
                                <label for="image">Image</label>
                                <input type="file" accept="image/*" class="form-control-file" id="image" name="image">
                            </div>
                        </form>
                    `

                    amodal.setTitleText("NEW FLEET")
                    amodal.setBodyHtml(form);
                    amodal.setFooterHtml(`<button class="btn btn-primary" id="save_fleet">SAVE</button>`)
                    amodal.show()

                    $('#save_fleet').click(async function(){
                        let ids = ['plate_number','description','capacity','make_year','mypk',
                        'manufacturer','model','chassis','fuel_type']
                        if(anton.validateInputs(ids)){
                            let payload = {
                                module:'vehicle',
                                data:anton.Inputs(ids)
                            }

                            payload['data']['user'] = $('#mypk').val()

                            await api.v2('PUT',payload,logistics.interface).then(response => {
                                if(anton.IsRequest(response)){
                                    $('#fleet_id').val(response.message)
                                    $('#update_fleet_car').submit()
                                } else {
                                    kasa.response(response)
                                }
                            }).catch(error => {kasa.error(error)})
                        }
                    })
                })

                $('#trips').click(async function(){
                    let body = `
                    <div style="height: 75vh !important" class="d-flex leg justify-content-center align-items-center">
                        <div class="spinner-container">
                            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                                <span class="sr-only">Loading...</span>
                            </div>
                        </div>
                    </div>
                    `

                    amodal.setTitleText("TRIPS")
                    amodal.setBodyHtml(body)
                    amodal.setSize('L')
                    amodal.show()
                    amodal.setFooterHtml(`<button class="btn exp btn-primary">Export</button>`)
                    amodal.show()

                    await logistics.getFleet(`${$('#pk').val()}`).then(response => {
                        if(anton.IsRequest(response)){
                            console.table(response)
                            let trips = response['message'][0]['deliveries']
                            let tr = '';
                            arr.push(['REQUEST DATE','SOURCE','DESTINATION','DRIVER','STATUS','REQUESTED BY'])
                            if(trips.length > 0){
                                trips.map(item => {
                                    let xr = [item['request_date'].split('T')[0],item['source'],item['destination'],item['driver']['name'],item['status'],item['requested_by']['name']]
                                    arr.push(xr)
                                    tr += `
                                        <tr>
                                            <td>${item['request_date'].split('T')[0]}</td>
                                            <td>${item['source']}</td>
                                             <td>${item['destination']}</td>
                                            <td>${item['driver']['name']}</td>
                                            <td>${item['status']}</td>
                                            <td>${item['requested_by']['name']}</td>
                                        </td>
                                    `
                                })

                                let table = `
                                    <table class="table table-sm table-bordered">
                                        <thead><tr><th>DATE</th><th>SOURCE</th><th>DESTINATION</th><th>DRIVER</th><th>STATUS</th><th>USER</th></tr></thead>
                                        <tbody>${tr}</tbody>
                                `

                                $('.leg').html(table)
                                $('.leg').removeClass('justify-content-center')
                                $('.leg').removeClass('align-content-center')
                                $('.leg').removeClass('d-flex')

                            } else {
                                let table = `No trips found`
                                $('.leg').html(table)
                            }
                        } else {
                            $('.leg').html(response.message)
                        }
                    }).catch(error => {
                        $('.leg').html(error.message)
                    })

                    $('.exp').click(function(){
                        anton.downloadCSV(`${$('#plate_number').val().replace(' ','_')}_trips.csv`,anton.convertToCSV(arr))
                    })

                })

                $('#service_history').click(function(){
                    let body = `
                    <div style="height: 75vh !important" class="d-flex justify-content-center align-items-center">
                        <div class="spinner-container">
                            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"> <span class="sr-only">Loading...</span></div>
                        </div>
                    </div>`

                    amodal.setTitleText("SERVICING REQUEST")
                    amodal.setBodyHtml(body)
                    amodal.setSize('L')
                    amodal.show()
                    amodal.setFooterHtml(`<button class="btn btn-primary">Export</button><button id="new_service_request" class="btn btn-info ms-2"><i class="fa fa-plus"></i> Service Request</button>`)
                    amodal.show()

                    $('#new_service_request').click(function(){
                        let body = "";
                        body += fom.selectv2('type',[{'val':'service','desc':'Service'},{'val':'repair','desc':'Repair'}])
                        body += fom.textarea('details',10,true)
                        body += fom.textarea('for_mechanic',4,true)

                        amodal.setTitleText("NEW SERVICE REQUEST")
                        amodal.setBodyHtml(body)
                        amodal.setSize('L')
                        amodal.show()
                        amodal.setFooterHtml(`<button class="btn btn-primary" id="save_service_request">SAVE</button>`)
                        amodal.show()

                        $('#save_service_request').click(async function(){
                            let ids = ['type','details','for_mechanic','pk','mypk']
                            if(anton.validateInputs(ids)){
                                let payload = {
                                    module:'vehicle_service_request',
                                    data:anton.Inputs(ids)
                                }

                                await api.v2('PUT',payload,logistics.interface).then(response => {
                                    if(anton.IsRequest(response)){
                                        $('#block').val(response.message)
                                        kasa.confirm(response.message,1,'here')
                                    } else {
                                        kasa.response(response)
                                    }
                                }).catch(error => {kasa.error(error)})
                            }
                        })
                    })

                })

                $('#images').click(function(){
                    let body = `
                    <div style="height: 75vh !important" class="d-flex justify-content-center align-items-center">
                        <div class="spinner-container">
                            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"> <span class="sr-only">Loading...</span></div>
                        </div>
                    </div>`

                    amodal.setTitleText("IMAGES")
                    amodal.setBodyHtml(body)
                    amodal.setSize('L')
                    amodal.show()
                    amodal.setFooterHtml(`<button class="btn btn-primary">Export</button>`)
                    amodal.show()
                })

                $('#fuel').click(async function(){




                    let body = `
                    <div style="height: 75vh !important" class="d-flex leg justify-content-center align-items-center">
                        <div class="spinner-container">
                            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"> <span class="sr-only">Loading...</span></div>
                        </div>
                    </div>`

                    amodal.setTitleText("FUELING HISTORY")
                    amodal.setBodyHtml(body)
                    amodal.setSize('L')
                    amodal.show()
                    amodal.setFooterHtml(`<button class="btn btn-primary">Export</button><button style="margin-right:50px !important" id="record_purchase" class="btn btn-info ms-2"><i class="fa fa-gas-pump"></i></button>`)
                    amodal.show()



                    $('#record_purchase').click(function(){
                        let body = "";
                        body += fom.number('amount','how much purchase?',true)
                        body += fom.number('rate','price per lt',true)
                        body +=  `
                            <form id="snd_rep" method='post' enctype="multipart/form-data" action="/logistic/fuel-reciept/" >
                             <input type="hidden" name="block" id="block">
                            <input type="file" name="receipt" class="form-control" id="receipt"></form>
                        `

                        amodal.setTitleText("NEW RECORD")
                        amodal.setBodyHtml(body)
                        amodal.setSize('L')
                        amodal.show()
                        amodal.setFooterHtml(`<button class="btn btn-primary" id="save_fuel">SAVE</button>`)
                        amodal.show()

                        $('#save_fuel').click(async function(){
                            let ids = ['amount','rate','pk','mypk','receipt']
                            if(anton.validateInputs(ids)){
                                let payload = {
                                    module:'fuel_purchase',
                                    data:anton.Inputs(ids)
                                }

                                await api.v2('PUT',payload,logistics.interface).then(response => {
                                    if(anton.IsRequest(response)){
                                        $('#block').val(response.message)
                                        $('#snd_rep').submit()
                                    } else {
                                        kasa.response(response)
                                    }
                                })

                            }
                        })

                    })

                    await logistics.getFleet(`${$('#pk').val()}`).then(response => {
                        if(anton.IsRequest(response)){
                            console.table(response)
                            let fuel_history = response['message'][0]['fuel_history']
                            let tr = '';
                            if(fuel_history.length > 0){
                                fuel_history.map(item => {
                                    tr += `
                                        <tr>
                                            <td>${item['date']}</td>
                                            <td>${item['amount']}</td>
                                            <td>${item['rate']}</td>
                                            <td>${item['litres']}</td>
                                             <td>${item['user']['name']}</td>
                                            <td><a href="javascript:void(0)" onclick="anton.viewFile('${item['image']}')"><i class="fa fa-eye"></i></a></td>
                                        </tr>
                                    `



                                })

                                let table = `
                                    <table class="table table-sm table-bordered">
                                        <thead><tr><th>DATE</th><th>AMOUNT</th><th>RATE</th><th>LIT.</th><th>USER</th><th>Reciept</th></tr></thead>
                                        <tbody>${tr}</tbody>

                                    </table>
                                `

                                $('.leg').html(table)
                                $('.leg').removeClass('justify-content-center')
                                $('.leg').removeClass('align-content-center')
                                $('.leg').removeClass('d-flex')
                            } else {
                                let table = `No fuel history found`
                                $('.leg').html(table)
                            }

                        } else {
                            $('.leg').html(response.message)
                        }
                    }).catch(error => {
                        $('.leg').html(error)
                    })

                })


            }

        )
    </script>

{% endblock %}
