{% extends "admin/base_site.html" %}
{% block content %}
<form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="{{ action }}">
    {% for device in devices %}
        <input type="hidden" name="_selected_action" value="{{ device.pk }}">
    {% endfor %}
    <p>Selected devices: <strong>{% for d in devices %}{{ d.serial_number }}{% if not forloop.last %}, {% endif %}{% endfor %}</strong></p>
    {{ form.as_p }}
    <button type="submit" name="apply" class="button">Schedule Backfill</button>
</form>
{% endblock %}
