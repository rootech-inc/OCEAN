{% extends 'crm/base.html' %}
{% load static %}

{% block crm %}

    <div class="card-body p-2">
        <div class="row no-gutters d-flex flex-wrap">
            <!-- Sectors Card -->
            <div class="col-lg-4 col-md-6 col-12 mb-3 d-flex align-items-stretch">
                <div class="card shadow-sm border-primary w-100 h-100">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-2">
                        <span class="h6 mb-0 d-flex align-items-center">
                            <i class="fa fa-layer-group mr-2 text-primary"></i> Sectors
                        </span>
                        <button 
                            onclick="crm.newSectorScreen()" 
                            class="btn btn-sm btn-primary rounded-circle" 
                            aria-label="Add Sector">
                            <i class="fa fa-plus"></i>
                        </button>
                    </div>
                    <div class="card-body p-2">
                        <div class="table-responsive">
                            <table class="table table-sm table-hover table-borderless mb-0">
                                <thead class="thead-light">
                                    <tr>
                                        <th>Section</th>
                                        <th class="text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="sectors">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Positions Card -->
            <div class="col-lg-4 col-md-6 col-12 mb-3 d-flex align-items-stretch">
                <div class="card shadow-sm border-info w-100 h-100">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-2">
                        <span class="h6 mb-0 d-flex align-items-center">
                            <i class="fa fa-briefcase mr-2 text-info"></i> Positions
                        </span>
                        <button 
                            onclick="crm.newPositionScreen()" 
                            class="btn btn-sm btn-info rounded-circle" 
                            aria-label="Add Position">
                            <i class="fa fa-plus"></i>
                        </button>
                    </div>
                    <div class="card-body p-2">
                        <div class="table-responsive">
                            <table class="table table-sm table-hover table-borderless mb-0">
                                <thead class="thead-light">
                                    <tr>
                                        <th>Position</th>
                                        <th class="text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="position">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Optionally add a third column, mark as needed. Otherwise use col-lg-4 for spacing. -->
            <div class="col-lg-4 col-12 d-none d-lg-block"></div>
        </div>
        <style>
            @media (max-width: 767.98px) {
                .card-header .btn {
                    margin-top: 8px;
                }
                .card-body .table-responsive {
                    font-size: 0.98rem;
                }
            }
            .table td, .table th {
                vertical-align: middle !important;
            }
            .card {
                min-height: 320px;
            }
        </style>
    </div>


    <script>

        function loadSectors(){
            let sectors = crm.getSector('*');
            if(anton.IsRequest(sectors)){
                let secs = sectors['message'];
                let tr = ``;
                for (let i = 0; i < secs.length; i++) {
                    let sec = secs[i]
                    tr += `<tr>
                        <td colspan="2">${sec['name']}</td>
                        <td colspan="2"><a class='text-danger del_sector' data-id='${sec['pk']}' href='javascript:void(0)'><i class='fa fa-trash'></i></a></td>
                       </tr>`
                }

                $('#sectors').html(tr)

                $('.del_sector').click(async function(){

                    if(confirm("Are you sure?")){
                        let pk = $(this).data('id');
                        let payload = {
                            module:'sector',
                            data:{pk:pk}
                        }

                        await api.v2('DELETE',payload,'/crm/api/').then(response => {
                            console.table(response)
                            kasa.confirm(response.message,1,'here')
                        }).catch(error => {kasa.error(error)})
                    }



                });
            } else {
                kasa.response(sectors)
            }
        }

        function loadPositions(){
            let positions = crm.getPosition('*');
            if(anton.IsRequest(positions)){
                let poss = positions['message'];
                let tr = ``;
                for (let p = 0; p < poss.length; p++) {
                    let pos = poss[p]
                    tr += `<tr>
                        <td colspan="2">${pos['name']}</td>
                        <td colspan="2"><a class='text-danger del_position' data-id='${pos['pk']}' href='javascript:void(0)'><i class='fa fa-trash'></i></a></td>
                    </tr>`
                }

                $('#position').html(tr)
                $('.del_position').click(async function(){

                    if(confirm("Are you sure?")){
                        let pk = $(this).data('id');
                        let payload = {
                            module:'position',
                            data:{pk:pk}
                        }

                        await api.v2('DELETE',payload,'/crm/api/').then(response => {
                            console.table(response)
                            kasa.confirm(response.message,1,'here')
                        }).catch(error => {kasa.error(error)})
                    }



                });
            } else {
                kasa.response(positions)
            }
        }

        loadSectors()
        loadPositions()


    </script>
{% endblock %}
