{% extends 'crm/base.html' %}
{% load static %}

{% block crm %}
    <div class="card-header"><strong class="card-title">Sales Deals</strong></div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="text-nowrap">Customer</th>
                        <th class="text-nowrap">Company</th>
                        <th class="text-nowrap text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="purc_tables">
                    <!-- Dynamic rows inserted here -->
                </tbody>
            </table>
        </div>
        <!-- Mobile-friendly cards (hidden on md+ screens, visible on xs/sm) -->
        <div id="purc_cards" class="d-block d-md-none mt-2">
            <!-- Dynamic mobile cards inserted here by JS -->
        </div>
    </div>
    <script>
        $(document).ready(function(){
            // load open purchases
            let open_purchases = cmms.getOpenPurchases();
            let purch_rows = "";
            let purch_cards = "";

            if(anton.IsRequest(open_purchases)){
                let msg = open_purchases.message
                for (let i = 0; i < msg.length; i++) {
                    let row = msg[i];
                    // Desktop/tablet row
                    purch_rows += `
                        <tr>
                            <td class="text-nowrap">${row['customer']}</td>
                            <td class="text-nowrap">${row['company']}</td>
                            <td class="text-center">
                                <a onclick="cmms_sales.viewTransactions('${row['pk']}')" href="javascript:void(0)" class="btn btn-sm btn-outline-primary" title="View"><i class="fa fa-eye"></i></a>
                            </td>
                        </tr>
                    `;
                    // Mobile card
                    purch_cards += `
                        <div class="card mb-2 shadow-sm">
                            <div class="card-body py-2 px-3">
                                <div class="d-flex flex-column">
                                    <div><strong>Customer:</strong> ${row['customer']}</div>
                                    <div><strong>Company:</strong> ${row['company']}</div>
                                    <div class="mt-2">
                                        <a onclick="cmms_sales.viewTransactions('${row['pk']}')" href="javascript:void(0)" class="btn btn-sm btn-outline-primary w-100" title="View"><i class="fa fa-eye"></i> View</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Populate table rows (shown on md+ screens)
                $('#purc_tables').html(purch_rows);
                // Populate cards (shown on xs/sm screens)
                $('#purc_cards').html(purch_cards);
            }
        });
    </script>
