{% extends 'servicing/base.html' %}
{% load static %}

{% block body %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm border-0 rounded-0 overflow-hidden"
                style="background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);">
                <div class="card-header bg-primary text-white py-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-cart-plus me-2"></i> MATERIAL REQUESTS</h5>
                        <div id="loading_spinner" class="spinner-border spinner-border-sm text-light d-none"
                            role="status"></div>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-uppercase small fw-bold">
                                <tr>
                                    <th class="px-4">Date & Time</th>
                                    <th>Job Card</th>
                                    <th>Supplier</th>
                                    <th>Location</th>
                                    <th class="text-end">Total Amount</th>
                                    <th class="text-center">Status</th>
                                    <th class="text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="mr_table_body">
                                <tr>
                                    <td colspan="7" class="text-center py-5">
                                        <div class="spinner-border text-primary" role="status"></div>
                                        <p class="mt-2 text-muted">Loading material requests...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MR Details Modal -->
<div class="modal fade" id="mrDetailsModal" tabindex="-1" aria-labelledby="mrDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 rounded-0 shadow-lg">
            <div class="modal-header bg-dark text-white rounded-0">
                <h5 class="modal-title fw-bold" id="mrDetailsModalLabel"><i class="bi bi-eye me-2"></i> Request Details
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body p-4 bg-light">
                <div id="mr_details_content">
                    <!-- Loaded via JS -->
                </div>

                <hr class="my-4">

                <div id="approval_section">
                    <h6 class="fw-bold mb-3 text-primary"><i class="bi bi-shield-check me-2"></i> Approval Action</h6>
                    <div class="mb-3">
                        <label for="approval_remarks" class="form-label small fw-bold">Review Remarks</label>
                        <textarea class="form-control rounded-0 border-2" id="approval_remarks" rows="3"
                            placeholder="Enter approval or rejection remarks..."></textarea>
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                        <button type="button" class="btn btn-outline-secondary rounded-0 px-4"
                            data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-success rounded-0 px-4 fw-bold"
                            onclick="processApproval()">APPROVE REQUEST</button>
                    </div>
                </div>

                <div id="approval_info" class="d-none">
                    <div class="alert alert-success border-0 rounded-0 d-flex align-items-center mb-0" role="alert">
                        <i class="bi bi-check-circle-fill fs-4 me-3"></i>
                        <div>
                            <div class="fw-bold">Approved Request</div>
                            <div id="approval_history_text" class="small text-muted"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let current_mr_pk = null;

    $(document).ready(function () {
        loadMaterialRequests();
    });

    function loadMaterialRequests() {
        $('#loading_spinner').removeClass('d-none');
        let payload = {
            module: 'get_material_requests',
            data: {}
        };

        let req = api.call('VIEW', payload, '/servicing/api/');
        $('#loading_spinner').addClass('d-none');

        if (anton.IsRequest(req)) {
            let mrs = req['message'];
            let rows = '';
            if (mrs.length === 0) {
                rows = '<tr><td colspan="7" class="text-center py-4">No material requests found.</td></tr>';
            } else {
                mrs.forEach(mr => {
                    let statusBadge = '';
                    if (mr.is_delivered) {
                        statusBadge = '<span class="badge bg-success rounded-pill px-3">Delivered</span>';
                    } else if (mr.is_approved) {
                        statusBadge = '<span class="badge bg-info rounded-pill px-3">Approved</span>';
                    } else {
                        statusBadge = '<span class="badge bg-warning text-dark rounded-pill px-3">Requested</span>';
                    }

                    rows += `
                        <tr class="small">
                            <td class="px-4 text-muted">${mr.date}</td>
                            <td><a href="/servicing/jobcard/tracking/${mr.service_card}/" class="text-decoration-none fw-bold">${mr.service_card}</a></td>
                            <td class="fw-bold text-dark">${mr.supplier}</td>
                            <td class="text-muted">${mr.location} <br><small>${mr.contact}</small></td>
                            <td class="text-end fw-bold">GH₵ ${mr.total_amount.toFixed(2)}</td>
                            <td class="text-center">${statusBadge}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-primary rounded-0 py-0 px-2" onclick="viewMrDetails(${mr.pk})">
                                    <i class="bi bi-eye"></i> View
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }
            $('#mr_table_body').html(rows);
        } else {
            kasa.error("Failed to load material requests");
            $('#mr_table_body').html('<tr><td colspan="7" class="text-center py-4 text-danger">Error loading data.</td></tr>');
        }
    }

    function viewMrDetails(pk) {
        current_mr_pk = pk;
        let payload = {
            module: 'get_material_request_details',
            data: { pk: pk }
        };

        let req = api.call('VIEW', payload, '/servicing/api/');
        if (anton.IsRequest(req)) {
            let data = req['message'];
            renderDetails(data);
            $('#mrDetailsModal').modal('show');
        } else {
            kasa.error("Could not fetch details");
        }
    }

    function renderDetails(m) {
        let h = m.header;
        let t = m.transactions;

        let content = `
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="p-2 border-start border-primary border-4 bg-white mb-2">
                        <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.7rem;">Job Card</small>
                        <span class="fw-bold">${h.service_card}</span>
                    </div>
                </div>
                <div class="col-md-6">
                   <div class="p-2 border-start border-primary border-4 bg-white mb-2">
                        <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.7rem;">Supplier</small>
                        <span class="fw-bold">${h.supplier_name}</span>
                    </div>
                </div>
                <div class="col-md-6 text-muted small">
                    <p class="mb-0"><i class="bi bi-telephone me-2"></i> ${h.contact}</p>
                    <p class="mb-0"><i class="bi bi-geo-alt me-2"></i> ${h.location}</p>
                </div>
                <div class="col-md-6 text-end">
                    <div class="h4 fw-bold text-primary mb-0">GH₵ ${h.grand_total.toFixed(2)}</div>
                    <small class="text-muted fw-bold">TOTAL ESTIMATE</small>
                </div>
                <div class="col-12 mt-3">
                    <p class="small text-muted p-2 bg-white border"><strong>Technician Remarks:</strong> ${h.remarks || 'No remarks'}</p>
                </div>
            </div>

            <h6 class="fw-bold mt-4 mb-3"><i class="bi bi-list-ul me-2"></i> Requested Items</h6>
            <div class="table-responsive">
                <table class="table table-bordered table-sm small align-middle mb-0">
                    <thead class="bg-secondary text-white">
                        <tr>
                            <th class="ps-2">Description</th>
                            <th class="text-end" style="width: 100px;">Price</th>
                            <th class="text-center" style="width: 80px;">Qty</th>
                            <th class="text-end pe-2" style="width: 120px;">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${t.map(item => `
                            <tr>
                                <td class="ps-2 fw-bold text-dark">${item.name}</td>
                                <td class="text-end">GH₵ ${item.price.toFixed(2)}</td>
                                <td class="text-center">${item.quantity}</td>
                                <td class="text-end pe-2 fw-bold">GH₵ ${item.total.toFixed(2)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;

        $('#mr_details_content').html(content);

        if (h.is_approved) {
            $('#approval_section').addClass('d-none');
            $('#approval_info').removeClass('d-none');
            $('#approval_history_text').html(`By ${h.approved_by} | Remarks: ${h.approval_remarks || 'None'}`);
        } else {
            $('#approval_section').removeClass('d-none');
            $('#approval_info').addClass('d-none');
            $('#approval_remarks').val('');
        }
    }

    function processApproval() {
        let remarks = $('#approval_remarks').val();
        if (!confirm("Are you sure you want to approve this material request? This will notify the Accounts department.")) return;

        let payload = {
            module: 'approve_material_request',
            data: {
                pk: current_mr_pk,
                remarks: remarks
            }
        };

        let req = api.call('PATCH', payload, '/servicing/api/');
        if (anton.IsRequest(req)) {
            kasa.success(req['message']);
            $('#mrDetailsModal').modal('hide');
            loadMaterialRequests();
        } else {
            kasa.error("Approval failed: " + req['message']);
        }
    }
</script>
{% endblock %}
