{% extends 'ssml/ssmlbase.html' %}
{% load static %}

{% block body %}

    <div style="height:90vh" class="card">
        <div class="card-header">
            <div class="w-100 d-flex flex-wrap">
                <button id="new" class="btn btn-primary btn-sm ms-2"><i class="fa fa-plus"></i> New</button>
                <button class="btn btn-info btn-sm ms-2">Previous</button>
                <button class="btn btn-info btn-sm ms-2">Next</button>
                <button id="print" class="btn btn-secondary btn-sm ms-2"><i class="fa fa-print"></i> Print</button>
            </div>
        </div>
        <div class="card-body p-2 overflow-hidden">
            <div class="w-100 h-25 bg-info overflow-hidden">
                <div class="container py-3">
                    <div class="row">
                        <div class="col-sm-4">
                        <div class="row mb-2">
                            <div class="col-sm-4"><label for="entry_no">Entry No.</label></div>
                            <div class="col-sm-8">
                                <input type="text" class="form-control rounded-0" id="entry_no">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-sm-4"><label for="date">Date</label></div>
                            <div class="col-sm-8">
                                <input type="text" class="form-control rounded-0" id="date">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-sm-4"><label for="total">Total</label></div>
                            <div class="col-sm-8">
                                <input type="text" class="form-control rounded-0" id="total">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="row mb-2">
                            <div class="col-sm-4"><label for="month">Month</label></div>
                            <div class="col-sm-8">
                                <input type="text" class="form-control rounded-0" id="month">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-sm-4"><label for="total_in">Total In</label></div>
                            <div class="col-sm-8">
                                <input type="text" class="form-control rounded-0" id="total_in">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-sm-4"><label for="total_out">Total Out</label></div>
                            <div class="col-sm-8">
                                <input type="text" class="form-control rounded-0" id="total_out">
                            </div>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
            <div class="w-100 h-75 overflow-auto pb-5">
                <table class="table table-sm table-hover table-bordered table-bordered">
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>DESCRIPTION</th>
                            <th>REFERENCE</th>
                            <th>AMOUNT</th>
                        </tr>
                    </thead>
                    <tbody id="petty_cash_table"></tbody>
                </table>
            </div>
        </div>
    </div>


    <script>
        $(document).ready(function () {
            ssml.loadPettyCash(`{{ last_petty_cash_entry }}`)
            $('#new').click(function () {
                ssml.newPettyCash()
            })

            $("#print").click(function(){
                ssml.printPetterCash($('#entry_no').val())
            })
        })
    </script>

{% endblock %}
