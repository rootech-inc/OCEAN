{% extends 'ssml/ssmlbase.html' %}
{% load static %}

{% block body %}
<!-- Modernized Invoicing Styles -->
<style>
    :root {
        --glass-bg: rgba(255, 255, 255, 0.95);
        --glass-border: rgba(255, 255, 255, 0.18);
        --accent-primary: #0d6efd;
        --accent-secondary: #6c757d;
        --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    }

    .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid var(--glass-border);
        border-radius: 15px;
        box-shadow: var(--card-shadow);
        overflow: hidden;
        transition: transform 0.3s ease;
    }

    .premium-header {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: white;
        padding: 1.5rem;
        border-bottom: none;
    }

    .form-control-premium {
        border-radius: 10px;
        border: 1px solid #dee2e6;
        padding: 0.6rem 1rem;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.9);
        font-weight: 500;
    }

    .btn-premium {
        border-radius: 10px;
        padding: 0.6rem 1.2rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
        font-size: 0.85rem;
    }

    .btn-premium-info {
        background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);
        border: none;
        color: white;
    }

    .btn-premium-dark {
        background: linear-gradient(135deg, #343a40 0%, #23272b 100%);
        border: none;
        color: white;
    }

    .btn-premium-primary {
        background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
        border: none;
        color: white;
    }

    .btn-premium-success {
        background: linear-gradient(135deg, #28a745 0%, #218838 100%);
        border: none;
        color: white;
    }

    .btn-premium-warning {
        background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%);
        border: none;
        color: #212529;
    }

    .nav-btn-group .btn {
        padding: 0.6rem 1rem;
    }
</style>

<div class="pagetitle mb-4">
    <h1>Contractor Invoices</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'ssml' %}">Home</a></li>
            <li class="breadcrumb-item active">Invoice Viewer</li>
        </ol>
    </nav>
</div>

<div class="glass-card mb-4">
    <div class="premium-header">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex gap-2 nav-btn-group">
                <a href="{% url 'new-cont-inv' %}" class="btn btn-premium btn-premium-info ms-2">
                    <i class="bi bi-plus-circle"></i> NEW
                </a>
                <button id="prev_btn" class="btn btn-premium btn-premium-info">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <button id="next_btn" class="btn btn-premium btn-premium-info">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
            <div class="d-flex gap-2">
                <button id="edit_btn" class="btn btn-premium btn-premium-warning">
                    <i class="bi bi-pencil-square"></i> EDIT
                </button>
                <button id="print" class="btn btn-premium btn-premium-dark">
                    <i class="bi bi-printer"></i> PRINT
                </button>
                <button id="approve" class="btn btn-premium btn-premium-primary">
                    <i class="bi bi-check2-circle"></i> APPROVE
                </button>
                <button id="post" class="btn btn-premium btn-premium-success">
                    <i class="bi bi-send-check"></i> POST
                </button>
            </div>
        </div>
    </div>
    <div class="card-body p-4">
        <div class="row g-3">
            <div class="col-md-3">
                <div class="form-group mb-2">
                    <label class="form-label fw-bold text-muted small text-uppercase">Entry No</label>
                    <input type="text" disabled id="entry_no" class="form-control form-control-premium bg-light">
                </div>
                <input type="hidden" id="id">
                <div class="form-group mb-2">
                    <label class="form-label fw-bold text-muted small text-uppercase">Date</label>
                    <input disabled type="date" id="entry_date" class="form-control form-control-premium bg-light">
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group mb-2">
                    <label class="form-label fw-bold text-muted small text-uppercase">Contractor</label>
                    <input type="text" disabled id="contractor" class="form-control form-control-premium bg-light">
                </div>
                <div class="form-group mb-2">
                    <label class="form-label fw-bold text-muted small text-uppercase">Total Amount</label>
                    <input disabled type="text" id="total_amount"
                        class="form-control form-control-premium bg-light font-monospace">
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group mb-2">
                    <label class="form-label fw-bold text-muted small text-uppercase">Remarks</label>
                    <input disabled type="text" id="remarks" class="form-control form-control-premium bg-light">
                </div>
                <div class="form-group mb-2">
                    <label class="form-label fw-bold text-muted small text-uppercase">Status</label>
                    <input disabled type="text" id="status"
                        class="form-control form-control-premium bg-light fw-bold text-primary">
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group mb-2">
                    <label class="form-label fw-bold text-muted small text-uppercase">Created By</label>
                    <input disabled type="text" id="created_by" class="form-control form-control-premium bg-light">
                </div>
                <div class="mt-4 pt-1">
                    <input type="hidden" id="next">
                    <input type="hidden" id="previous">
                </div>
            </div>
        </div>
    </div>
</div>

<div class="glass-card">
    <div class="p-3" style="background: #f8f9fa; border-bottom: 1px solid #eee;">
        <h6 class="mb-0 fw-bold"><i class="bi bi-list-task me-2"></i>LINE TRANSACTIONS</h6>
    </div>
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="bg-dark text-white">
                <tr>
                    <th class="ps-4">SERVICE</th>
                    <th>METER</th>
                    <th class="text-end pe-4">AMOUNT</th>
                </tr>
            </thead>
            <tbody id="god"></tbody>
        </table>
    </div>
</div>

<script>
    let last_entry = `{{ last_entry }}`;

    $(document).ready(function () {
        ssml.viewInvoice(last_entry)

        $('#prev_btn').click(function () {
            ssml.viewInvoice($('#previous').val())
        })
        $('#next_btn').click(function () {
            ssml.viewInvoice($('#next').val())
        })

        $('#approve').click(function () {
            ssml.approveInvoice($('#id').val())
        })

        $('#print').click(function () {
            ssml.printInvoice($('#id').val())
        })

        $('#edit_btn').click(function () {
            let id = $('#id').val();
            if (id) {
                window.location.href = `/ssml/accounts/invoice/edit/${id}/`;
            } else {
                kasa.error("No invoice selected to edit");
            }
        })
    })
</script>
{% endblock %}
