{% extends 'ssml/ssmlbase.html' %}
{% load static %}

{% block body %}
<!-- Modernized Invoicing Styles -->
<style>
    :root {
        --glass-bg: rgba(255, 255, 255, 0.95);
        --glass-border: rgba(255, 255, 255, 0.18);
        --accent-primary: #0d6efd;
        --accent-secondary: #6c757d;
        --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    }

    .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid var(--glass-border);
        border-radius: 15px;
        box-shadow: var(--card-shadow);
        overflow: hidden;
        transition: transform 0.3s ease;
    }

    .premium-header {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: white;
        padding: 1.5rem;
        border-bottom: none;
    }

    .form-control-premium {
        border-radius: 10px;
        border: 1px solid #dee2e6;
        padding: 0.6rem 1rem;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.9);
        font-weight: 500;
    }

    .btn-premium {
        border-radius: 10px;
        padding: 0.6rem 1.2rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
        font-size: 0.85rem;
    }

    .btn-premium-info {
        background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);
        border: none;
        color: white;
    }

    .btn-premium-dark {
        background: linear-gradient(135deg, #343a40 0%, #23272b 100%);
        border: none;
        color: white;
    }

    .btn-premium-primary {
        background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
        border: none;
        color: white;
    }

    .btn-premium-success {
        background: linear-gradient(135deg, #28a745 0%, #218838 100%);
        border: none;
        color: white;
    }

    .btn-premium-warning {
        background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%);
        border: none;
        color: #212529;
    }

    .nav-btn-group .btn {
        padding: 0.6rem 1rem;
    }
</style>

<div class="card w-100 h-100">

    <input type="hidden" id="next">
    <input type="hidden" id="previous">
    <div class="card-header">
        <div class="w-100 d-flex flex-wrap justify-content-between">
            <div class="w-30 d-flex flex-wrap">
                <button id="new" class="btn btn-sm btn-premium-primary ms-2">
                    <i class="fa fa-plus"></i>
                </button>
                <button class="btn btn-sm btn-premium-warning ms-2">
                    <i class="fa fa-edit"></i>
                </button>
                <button id="delete" class="btn btn-sm btn-premium-dark ms-2">
                    <i class="fa fa-trash"></i>
                </button>
                <button id="prev_btn" class="btn btn-sm btn-premium-info ms-2">
                    <i class="fa fa-fast-backward"></i>
                </button>
                <button id="next_btn" class="btn btn-sm btn-premium-info ms-2">
                    <i class="fa fa-fast-forward"></i>
                </button>
            </div>
            <div class="w-30"></div>
            <div class="w-30 d-flex flex-wrap justify-content-end">
                <button id="print" class="btn btn-premium-info btn-inf ms-2">
                    <i class="fa fa-print"></i>
                </button>
                <button class="btn btn-premium-success btn-sm ms-2">
                    <i class="fa fa-check"></i>
                </button>
                <button class="btn btn-premium-warning btn-sm ms-2">
                    <i class="fa fa-check-square"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="card-body overflow-hidden">
        <div class="container py-2 h-100 overflow-auto">
            <div class="row">

                <!-- HEADER-->
                <div class="col-sm-3">
                    <div class="input-group mb-2">
                        <div class="input-group-append rounded-0 w-40">
                            <span class="input-group-text rounded-0">Invoice Date</span>
                        </div>
                        <input type="text" class="form-control rounded-0" readonly id="date">
                    </div>
                    <div class="input-group mb-2">
                        <div class="input-group-append rounded-0 w-40">
                            <span class="input-group-text rounded-0">Invoice No.</span>
                        </div>
                        <input type="text" class="form-control rounded-0" readonly id="entry_no">
                    </div>
                    <div class="input-group mb-2">
                        <div class="input-group-append rounded-0 w-40">
                            <span class="input-group-text rounded-0">Remarks</span>
                        </div>
                        <input type="text" class="form-control rounded-0" readonly id="remarks">
                    </div>
                </div>

                <div class="col-sm-3">
                    <div class="input-group mb-2">
                        <div class="input-group-append rounded-0 w-40">
                            <span class="input-group-text rounded-0">Contractor</span>
                        </div>
                        <input type="text" class="form-control rounded-0" readonly id="foc">
                    </div>
                    <div class="input-group mb-2">
                        <div class="input-group-append rounded-0 w-40">
                            <span class="input-group-text rounded-0">Phone</span>
                        </div>
                        <input type="text" class="form-control rounded-0" readonly id="phone">
                    </div>
                    <div class="input-group mb-2">
                        <div class="input-group-append rounded-0 w-40">
                            <span class="input-group-text rounded-0">Email Address</span>
                        </div>
                        <input type="text" class="form-control rounded-0" readonly id="email">
                    </div>
                </div>

                <div class="col-sm-3">
                    <div class="input-group mb-2">
                        <div class="input-group-append rounded-0 w-40">
                            <span class="input-group-text rounded-0">Gross Amt.</span>
                        </div>
                        <input type="text" class="form-control rounded-0" readonly id="gross">
                    </div>
                    <div class="input-group mb-2">
                        <div class="input-group-append rounded-0 w-40">
                            <span class="input-group-text rounded-0">Tax Amt.</span>
                        </div>
                        <input type="text" class="form-control rounded-0" readonly id="tax">
                    </div>
                    <div class="input-group mb-2">
                        <div class="input-group-append rounded-0 w-40">
                            <span class="input-group-text rounded-0">Net Amt.</span>
                        </div>
                        <input type="text" class="form-control rounded-0" readonly id="net">
                    </div>
                </div>

                <div class="col-sm-3">
                    <div class="input-group mb-2">
                        <div class="input-group-append rounded-0 w-40">
                            <span class="input-group-text rounded-0">Validated</span>
                        </div>
                        <input type="text" class="form-control rounded-0" readonly id="is_valid">
                        <div class="input-group-append w-20">
                            <button title="Validate Document" class="btn btn-info w-100 h-100" id="validate"
                                style="border-radius: 0 !important">
                                <i class="fa fa-info-circle"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group mb-2">
                        <div class="input-group-append rounded-0 w-40">
                            <span class="input-group-text rounded-0">Accepted</span>
                        </div>
                        <input type="text" class="form-control rounded-0" readonly id="is_accepted">
                        <div class="input-group-append w-20">
                            <button title="Document Acceptance" class="btn btn-info w-100 h-100" id="accepted" disabled
                                style="border-radius: 0 !important">
                                <i class="fa fa-info-circle"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group mb-2">
                        <div class="input-group-append rounded-0 w-40">
                            <span class="input-group-text rounded-0">Posted</span>
                        </div>
                        <input type="text" class="form-control rounded-0" readonly id="is_posted">
                        <div class="input-group-append w-20">
                            <button title="Post Document" class="btn btn-info w-100 h-100" id="post"
                                style="border-radius: 0 !important">
                                <i class="fa fa-info-circle"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- TRANSACTIONS -->
                <div class="col-sm-12">
                    <div class="card">
                        <div class="card-body p-2">
                            <table class="table table-bordered table-hover">
                                <thead class="thead-dark">
                                    <tr>
                                        <th>SN</th>
                                        <th>ITEM</th>
                                        <th>QUANTITY</th>
                                        <th>RATE</th>
                                        <th>AMOUNT</th>
                                    </tr>
                                </thead>
                                <tbody id="invoice_transactions"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>

<script>
    let last_entry = `{{ last_entry }}`;

    $(document).ready(function () {
        ssml.viewInvoice(last_entry)

        $('#new').click(function () {
            ssml.newFocInvoiceScreen()
        })

        $('#prev_btn').click(function () {
            ssml.viewInvoice($('#previous').val())
        })
        $('#next_btn').click(function () {
            ssml.viewInvoice($('#next').val())
        })

        $('#approve').click(function () {
            ssml.approveInvoice($('#id').val())
        })

        $('#post').click(function () {
            ssml.postInvoice()
        })

        $('#delete').click(function () {
            let entry_no = $('#entry_no').val()
            if(confirm('Are you sure you want to delete?')) {
                ssml.deletFocInvoice(entry_no)
            }

        })



        $('#edit_btn').click(function () {
            let id = $('#id').val();
            if (id) {
                window.location.href = `/ssml/accounts/invoice/edit/${id}/`;
            } else {
                kasa.error("No invoice selected to edit");
            }
        })

        $('#validate').click(function () {
            ssml.validateInvoice()
        })
    })
</script>
{% endblock %}
