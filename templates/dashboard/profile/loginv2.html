{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCEAN | Login</title>

  <!-- Design System - Sea Blue Ocean Theme -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">

  <style>
    :root {
      --ocean-bg: #e0f2fe;
      --ocean-dark: #f0f9ff;
      --ocean-card: #ffffff;
      --ocean-primary: #0284c7;
      --ocean-secondary: #38bdf8;
      --ocean-text: #0c4a6e;
      --ocean-surface: rgba(255, 255, 255, 0.9);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--ocean-bg);
      color: var(--ocean-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      overflow: hidden;
      /* Prevent scroll */
    }

    /* Abstract Background */
    .bg-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
    }

    .shape-1 {
      background: #0ea5e9;
      width: 500px;
      height: 500px;
      top: -100px;
      left: -100px;
      animation: float 20s infinite ease-in-out;
    }

    .shape-2 {
      background: #06b6d4;
      width: 400px;
      height: 400px;
      bottom: -50px;
      right: -50px;
      animation: float 15s infinite ease-in-out reverse;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(30px, 30px);
      }

      100% {
        transform: translate(0, 0);
      }
    }

    /* Card STyling */
    .login-card {
      background: var(--ocean-surface);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(149, 157, 165, 0.15);
      position: relative;
      z-index: 10;
    }

    .login-logo {
      font-size: 2rem;
      /* Adjusted size */
      font-weight: 700;
      color: var(--ocean-primary);
      text-align: center;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
      display: flex;
      /* Flex to align icon */
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-subtitle {
      text-align: center;
      color: var(--ocean-secondary);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* Form Controls */
    .form-floating>.form-control {
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: var(--ocean-text);
      border-radius: 8px;
    }

    .form-floating>.form-control:focus {
      background: rgba(0, 0, 0, 0.01);
      border-color: var(--ocean-primary);
      box-shadow: 0 0 0 0.25rem rgba(2, 132, 199, 0.25);
      color: var(--ocean-text);
    }

    .form-floating>label {
      color: rgba(12, 74, 110, 0.6);
    }

    .form-floating>.form-control:focus~label,
    .form-floating>.form-control:not(:placeholder-shown)~label {
      color: var(--ocean-primary);
      opacity: 1;
    }

    .btn-login {
      background: linear-gradient(135deg, #0d6efd, #0099cc);
      /* Sea blue gradient */
      border: none;
      color: white;
      padding: 0.8rem;
      border-radius: 8px;
      width: 100%;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-top: 1.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
      background: linear-gradient(135deg, #0b5ed7, #0088b5);
    }

    .error-message {
      color: #ff6b6b;
      font-size: 0.85rem;
      margin-top: 10px;
      text-align: center;
      display: none;
    }

    /* Loader Overlay */
    .loader-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s;
    }

    .loader-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Credits */
    .credits {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--ocean-secondary);
      position: absolute;
      bottom: 20px;
      width: 100%;
    }

    .credits a {
      color: var(--ocean-primary);
      text-decoration: none;
    }
  </style>
</head>

<body>

  <!-- Background Shapes -->
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
  </div>

  <div class="container d-flex flex-column align-items-center">

    <div class="login-card">
      <!-- Loader -->
      <div class="loader-overlay" id="loader">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div class="login-logo">
        <i class="bi bi-droplet-fill"></i> OCEAN
      </div>
      <div class="login-subtitle">Open Source ERP</div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="username" placeholder="Username" required autocomplete="username">
          <label for="username">Username</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="password" placeholder="Password" required
            autocomplete="current-password">
          <label for="password">Password</label>
        </div>

        <div class="error-message" id="errorMsg">
          <i class="bi bi-exclamation-circle me-1"></i> <span>Invalid Credentials</span>
        </div>

        <input type="hidden" id="nextUrl" value="{{ next }}">

        <button type="submit" class="btn btn-login">
          Sign In <i class="bi bi-arrow-right ms-1"></i>
        </button>
      </form>
    </div>

  </div>

  <div class="credits">
    Started by <a href="https://github.com/rootleet" target="_blank">Rootleet</a> • Maintained by the <a
      href="https://github.com/rootech-inc/ocean_live">Community</a>
  </div>

  <script>
    const API_URL = "/adapi/";

    function handleLogin(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const nextUrl = document.getElementById('nextUrl').value || '/stream/';
      const loader = document.getElementById('loader');
      const errorMsg = document.getElementById('errorMsg');
      const errorText = errorMsg.querySelector('span');

      // Reset UI
      errorMsg.style.display = 'none';
      loader.classList.add('active');

      const payload = {
        module: 'auth',
        data: {
          username: username,
          password: password,
          next: nextUrl
        }
      };

      fetch(API_URL, {
        method: 'VIEW',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(payload)
      })
        .then(res => res.json())
        .then(response => {
          loader.classList.remove('active');

          if (response.status_code === 200 && response.message.auth === 'yes') {
            // Success
            const redirectUrl = response.message.redirect || nextUrl;
            window.location.href = redirectUrl;
          } else {
            // Error
            errorText.textContent = response.message.error || 'Authentication failed';
            errorMsg.style.display = 'block';
          }
        })
        .catch(err => {
          loader.classList.remove('active');
          console.error('Login Error:', err);
          errorText.textContent = 'Connection error. Please try again.';
          errorMsg.style.display = 'block';
        });
    }
  </script>

</body>

</html>
