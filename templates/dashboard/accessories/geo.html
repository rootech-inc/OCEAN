{% extends 'base.html' %}
{% load static %}

{% block body %}
    <div class="card-header d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between gap-2 py-3 px-3 bg-white border-bottom-0">
        <strong class="card-title fs-5 text-primary mb-2 mb-sm-0">GEO LOCATIONS</strong>
        <button onclick="newCity()" class="btn btn-info d-flex align-items-center gap-2 px-3 shadow-sm">
            <i class="bi bi-plus-circle"></i>
            <span class="d-none d-sm-inline">NEW REGION</span>
            <span class="d-inline d-sm-none">New</span>
        </button>
    </div>

    <div class="card-body px-1 px-md-3 py-2 py-md-3">
        <div class="container-fluid px-0 h-100">
            <div class="row gx-2 gy-3 h-100 flex-nowrap flex-sm-wrap">
                <!-- Cities Sidebar -->
                <div class="col-12 col-sm-4 col-md-3 mb-2 mb-sm-0 h-100 d-flex flex-column">
                    <div class="rounded-3 bg-light shadow-sm flex-grow-1 d-flex flex-column p-0 h-100 overflow-auto" style="min-height:120px;">
                        <div class="px-3 pt-3 pb-1 d-flex align-items-center justify-content-between gap-1 border-bottom">
                            <span class="fw-semibold text-secondary"><i class="bi bi-geo-alt fs-5"></i> Regions</span>
                        </div>
                        <div id="cities" class="flex-grow-1 px-2 pt-2 pb-2 overflow-auto" style="max-height:65vh;">
                            <!-- Cities will be injected here -->
                        </div>
                    </div>
                </div>

                <!-- Subs Content -->
                <div class="col-12 col-sm-8 col-md-9 h-100 d-flex flex-column">
                    <div class="rounded-3 h-100 flex-grow-1 d-flex flex-column bg-white shadow-sm p-0">
                        <div class="card-header border-bottom-0 bg-white d-flex flex-wrap gap-2 justify-content-end align-items-center py-2 px-3">
                            <button onclick="newSub(this.value)" id="act_city" disabled class="btn btn-dark d-flex align-items-center gap-2">
                                <i class="bi bi-plus"></i>
                                <span class="d-none d-sm-inline">ADD SUB</span>
                                <span class="d-inline d-sm-none">Add</span>
                            </button>
                        </div>
                        <div id="subs" class="card-body p-2 overflow-auto flex-grow-1 d-flex">
                            <div class="d-flex w-100 h-100 flex-wrap align-content-center justify-content-center">
                                <div class="alert alert-info w-100 text-center">SELECT REGION</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        @media (max-width: 575.98px) {
            .card-header {
                padding-left: .7rem !important;
                padding-right: .7rem !important;
                padding-top: .7rem !important;
                padding-bottom: .7rem !important;
            }
            .card-body {
                padding-left: .5rem !important;
                padding-right: .5rem !important;
                padding-top: .7rem !important;
                padding-bottom: .7rem !important;
            }
        }
        @media (max-width: 767.98px) {
            .col-sm-4, .col-sm-8, .col-md-3, .col-md-9 {
                flex: 0 0 100%;
                max-width: 100%;
            }
            .card-header .btn {
                width: 100%;
                justify-content: center;
            }
        }
        @media (max-width: 450px) {
            .card-title { font-size: 1.1em !important; }
            .card-header, .card-body { padding: .4em .6em !important; }
        }
    </style>

    <script>
        function newCity() {

            Swal.fire({
              title: 'ENTER REGION',
              input: 'textarea',
              showCancelButton: true,
              confirmButtonText: 'Submit',
              cancelButtonText: 'Cancel',
              showLoaderOnConfirm: true,
              preConfirm: (text) => {
                if(!text || text.trim() === "") {
                  Swal.showValidationMessage(
                    `No data entered!`
                  )
                }
                else {
                  // split the text by newline character to get array of lines
                  var lines = text.split("\n");
                  let ok=0,okmsg='',xok=0,xokmsg='';

                  // loop through lines and do whatever you want
                  for(var i = 0; i < lines.length; i++){
                    {#console.log(lines[i]);#}
                    let payload = {
                        'module':'geo',
                        'data':{
                            'part':'city',
                            'name':lines[i],
                            'owner':$('#mypk').val()
                        }
                    }

                    let response = api.call('PUT',payload,'/adapi/')
                    {#console.table(response)#}
                    if(response['status_code'] === 200){
                        {#kasa.success(response['message'])#}
                        ok += 1
                    } else if (response['status_code'] === undefined) {
                        kasa.error("PROCEDURE ERROR")
                        xok += 1
                        xokmsg += `<small class="text-danger">PROCEDURE ERROR</small><br>`
                    } else {
                        xok += 1
                        xokmsg += `<small class="text-danger">${response['message']}</small><br>`
                    }

                  }

                  let ht = `<div class="text-left">
                    SUCCESS : ${ok} <br>ERROR : ${xok} <hr>${xokmsg}
                  </div>`;
                  kasa.html(ht)
                }
              },
            });

        }

        // load cities
        function load_cities() {
            let get_cities_payload = {
            'module':'geo',
            data:{
                part:"city",
                key:"*"
            }
        }

            let cities_response = api.call('VIEW',get_cities_payload,'/adapi/');
            if(cities_response['status_code'] === 200){
                let cities = cities_response['message']

                let buttons = ``
                for (let c = 0; c < cities.length; c++) {
                    console.table(cities)
                    let name = cities[c]['name']
                    let pk = cities[c]['pk'];

                    buttons += `<button onclick="loadSubs('${pk}')" class="w-100 mb-2 btn btn-outline-info" style="text-align: left !important">${name}</button>
                        `
                }
                $('#cities').html(buttons)
            } else {
                kasa.error(`COULD NOT LOAD CITIES ${cities_response['message']}`)
            }
        }

        function loadSubs(city) {
             // load cities
            let sub_cities_payload = {
                'module':'geo',
                data:{
                    part:"city",
                    key:city
                }
            }

            let sub_cities_response = api.call('VIEW',sub_cities_payload,'/adapi/');

            if(sub_cities_response['status_code'] === 200){
            let sub_cities = sub_cities_response['message']
            let subs = sub_cities[0]['subs'];
            let city_key = sub_cities[0]['pk']
            let sub_row = ``;

            $('#act_city').prop('disabled',false);
            $('#act_city').val(city_key);
            {#kasa.info(city_key)#}


            console.table(sub_cities);
            let sub_ht = `<div class="d-flex w-100 h-100 flex-wrap align-content-center justify-content-center">
                                    <div class="alert alert-info">no subs in ${sub_cities[0]['name']}</div>
                                </div>`
            if(subs.length > 0){
                let tr = ''
                // go through subs
                for (let s = 0; s < subs.length; s++) {
                    let sub = subs[s]
                    tr += `<tr><td>${sub['name']}</td><td><i class="bi bi-trash-fill text-danger"></i></td></tr>`
                }
                sub_ht = `<table class="table table-sm"><thead><tr><th>NAME</th><th>ACTION</th></tr></thead><tbody>${tr}</tbody><table>`

            }
            $('#subs').html(sub_ht)


        } else {
            kasa.error(`COULD NOT LOAD CITIES ${sub_cities_response['message']}`)
        }

        }

        function newSub(city) {
            Swal.fire({
              title: 'Enter subs',
              input: 'textarea',
              inputPlaceholder: 'Enter your subs here',
              preConfirm: function(subs) {
                subs = subs.split('\n'); // split by newline to get all lines
                let ok=0,okmsg='',xok=0,xokmsg='';
                subs.forEach(function(sub){
                  // loop through all lines and do something with each line
                  console.log('Sub:', sub);
                  console.log('City:', city);
                  let payload = {
                    module:'geo',data:{part:'sub','name':sub,'city':city,'owner':$('#mypk').val()}
                  };

                  let response = api.call('PUT',payload,'/adapi/');

                  if(response['status_code'] === 200){
                        {#kasa.success(response['message'])#}
                        ok += 1
                    } else if (response['status_code'] === undefined) {
                        kasa.error("PROCEDURE ERROR")
                        xok += 1
                        xokmsg += `<small class="text-danger">PROCEDURE ERROR</small><br>`
                    } else {
                        xok += 1
                        xokmsg += `<small class="text-danger">${response['message']}</small><br>`
                    }
                });
                let ht = `<div class="text-left">
                    SUCCESS : ${ok} <br>ERROR : ${xok} <hr>${xokmsg}
                  </div>`;
                kasa.html(ht)
              }
            }).then((result) => {
              console.log(result);
            });
        }

        load_cities()

    </script>

{% endblock %}
