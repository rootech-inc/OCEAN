{% load static %}
{% load permission_tags %}


<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Anton AI</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="{% static 'assets/img/favicon.png' %}" rel="icon">
  <link href="{% static 'assets/img/apple-touch-icon.png' %}" rel="apple-touch-icon">

  <!-- Vendor CSS Files -->
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/boxicons/css/boxicons.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/quill/quill.snow.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/quill/quill.bubble.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/remixicon/remixicon.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/simple-datatables/style.css' %}" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="{% static 'assets/css/style.css' %}" rel="stylesheet">
  <link href="{% static 'general/css/recorder.css' %}" rel="stylesheet">
  <link rel="manifest" href="{% static 'general/manifest.json' %}">

  <script src="{% static 'blog/js/jquery.min.js' %}"></script>
  <script src="{% static 'blog/js/popper.min.js' %}"></script>
  <script src="{% static 'blog/js/bootstrap.min.js' %}"></script>
  <script src="{% static 'general/js/cust.js' %}"></script>
  <script src="{% static 'general/js/admin.js' %}"></script>
  <script src="{% static 'general/js/error_handler.js' %}"></script>
  <script src="{% static 'general/js/sweetalert2@11' %}"></script>
  <script src="{% static 'general/js/all.js' %}"></script>
  <script src="{% static 'general/js/classes/api.js' %}"></script>
  <script src="{% static 'general/js/classes/anton.js' %}"></script>
  <script src="{% static 'general/js/classes/modal.js' %}"></script>
  <script src="{% static 'general/js/classes/form.js' %}"></script>
  <script src="{% static 'general/js/loader.js' %}"></script>

  <style>
    .install-button {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 20px;
      background-color: #333;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    .tox-promotion {
      display: none !important;
    }
  </style>
</head>

<body>
  <!-- MODALS -->
  <div id="g_modal" class="modal fade">
    <div id="g_modal_size" class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="g_modal_title"></h5>
          <button class="close btn btn-outline-danger" data-bs-dismiss="modal">X</button>
        </div>
        <div class="modal-body">
          <div class="w-100" id="g_modal_body">

          </div>
        </div>
        <div class="modal-footer" id="g_footer"></div>
      </div>
    </div>
  </div>
  <div class="modal" id="loader">
    <div class="w-100 bg_trans_80 h-100 d-flex flex-wrap align-content-center justify-content-center">
      <img src="{% static 'general/img/icons/2.gif' %}" alt="" class="img-fluid">
      <div class="w-100 text-center">
        <br>
        <small class="text-info" id="error_msg"></small>
      </div>
      <div id="loader_message" class="text-info">Loading....</div>
    </div>
  </div>
  <script>
    $('#loader').modal('show')
  </script>

  <input type="hidden" id="autos_url" value="{% url 'autos' 'ajax' %}">
  <input type="hidden" id="search_url" value="{% url 'search' %}">
  <input type="hidden" value="{{ request.user.pk }}" id="mypk">

  <!-- ======= Header ======= -->
  <header id="header" class="header fixed-top d-flex align-items-center">

    <div class="d-flex align-items-center justify-content-between">
      <a href="{% url 'home' %}" class="logo d-flex align-items-center">
        <img src="{% static 'assets/img/logo.png' %}" alt="">
        <span class="d-none d-lg-block">Anton AI</span>
      </a>
      <i class="bi bi-list toggle-sidebar-btn"></i>
    </div><!-- End Logo -->

    <nav class="header-nav ms-auto">
      <ul class="d-flex align-items-center">

        <li class="nav-item dropdown pe-3">

          <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown">
            <img src="{{ request.user|my_profile_picture }}" alt="Profile" class="rounded-circle">
            <span class="d-none d-md-block dropdown-toggle ps-2">{{ user.username }}</span>
          </a><!-- End Profile Iamge Icon -->

          <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
            <li class="dropdown-header">
              <h6>{{ user.firstname }} {{ user.lastname }}</h6>
            </li>
            <li>
              <hr class="dropdown-divider">
            </li>

            <li>
              <a class="dropdown-item d-flex align-items-center" href="{% url 'profile' %}">
                <i class="bi bi-person"></i>
                <span>My Profile</span>
              </a>
            </li>
            <li>
              <hr class="dropdown-divider">
            </li>

            <li>
              <a class="dropdown-item d-flex align-items-center" href="{% url 'logout' %}">
                <i class="bi bi-box-arrow-right"></i>
                <span>Sign Out</span>
              </a>
            </li>

          </ul><!-- End Profile Dropdown Items -->
        </li><!-- End Profile Nav -->

      </ul>
    </nav><!-- End Icons Navigation -->

  </header><!-- End Header -->

  <!-- ======= Sidebar ======= -->

  <aside id="sidebar" class="sidebar">

    <ul class="sidebar-nav" id="sidebar-nav">

      <li class="nav-item">
        <a class="nav-link collapsed" href="{% url 'anton_index' %}">
          <i class="bi bi-grid"></i>
          <span>Dashboard</span>
        </a>
      </li><!-- End Dashboard Nav -->

      <li class="nav-item">
        <a class="nav-link collapsed" href="{% url 'my_models' %}">
          <i class="bi bi-cpu"></i>
          <span>My Models</span>
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link collapsed" href="#">
          <i class="bi bi-chat-dots"></i>
          <span>Chat</span>
        </a>
      </li>

    </ul>

  </aside><!-- End Sidebar-->


  <main id="main" class="main">

    <div class="pagetitle">
      <h1>{{ page.title }}</h1>
    </div><!-- End Page Title -->

    <section class="section h-100" style="height: 85vh !important">
      <div class="w-100 h-100 overflow-hidden">
        {% block body %}

        {% endblock %}
      </div>


    </section>

  </main><!-- End #main -->



  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i
      class="bi bi-arrow-up-short"></i></a>

  <!-- Vendor JS Files -->
  <script src="{% static 'assets/vendor/apexcharts/apexcharts.min.js' %}"></script>
  <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/vendor/chart.js/chart.min.js' %}"></script>
  <script src="{% static 'assets/vendor/echarts/echarts.min.js' %}"></script>
  <script src="{% static 'assets/vendor/quill/quill.min.js' %}"></script>
  <script src="{% static 'assets/vendor/simple-datatables/simple-datatables.js' %}"></script>
  <script src="{% static 'assets/vendor/tinymce/tinymce.min.js' %}"></script>
  <script src="{% static 'assets/vendor/php-email-form/validate.js' %}"></script>


  <!-- Template Main JS File -->
  <script src="{% static 'assets/js/main.js' %}"></script>

  <script>
    $('#loader').delay(1000).modal('hide')
  </script>

</body>

</html>
