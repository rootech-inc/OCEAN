{% extends 'cmms/service/serv_base.html' %}
{% load static %}

{% block cmms %}
    <style>
        .car_btn{
            height: 80px;
            width: 100%;
        }
    </style>


    <div class="container-fluid">

        <div id="car_type" class="d-flex justify-content-center align-items-center" style="min-height: 100vh; width: 100vw; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">
            <div class="card shadow rounded-4" style="width: 100%; max-width: 420px; background: #fff;">
                <div class="card-header text-center bg-white border-0 pb-0">
                    <h4 class="fw-bold text-primary mb-0">Car Type</h4>
                </div>
                <div class="card-body py-4 d-flex flex-column justify-content-center align-items-center">
                    <div class="row w-100 g-4">
                        <div class="col-6 d-flex justify-content-center">
                            <button data-info="suv" class="btn btn-outline-primary car_class shadow-sm car_btn w-100 h-100 rounded-3">
                                <i class="fa fa-2x fa-car mb-2"></i><br>
                                <span class="fw-semibold">SUV</span>
                            </button>
                        </div>
                        <div class="col-6 d-flex justify-content-center">
                            <button data-info="truck" class="btn btn-outline-secondary car_class shadow-sm car_btn w-100 h-100 rounded-3">
                                <i class="fa fa-2x fa-truck mb-2"></i><br>
                                <span class="fw-semibold">Truck</span>
                            </button>
                        </div>
                        <div class="col-6 d-flex justify-content-center">
                            <button data-info="bus" class="btn btn-outline-info car_class shadow-sm car_btn w-100 h-100 rounded-3">
                                <i class="fa fa-2x fa-bus mb-2"></i><br>
                                <span class="fw-semibold">Bus</span>
                            </button>
                        </div>
                        <div class="col-6 d-flex justify-content-center">
                            <button data-info="pickup" class="btn btn-outline-danger car_class shadow-sm car_btn w-100 h-100 rounded-3">
                                <i class="fa fa-2x fa-truck-pickup mb-2"></i><br>
                                <span class="fw-semibold">Pickup</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div 
            id="service_type" 
            class="d-flex justify-content-center align-items-center"
            style="height: 100vh; min-height: 100vh; width: 100vw; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);"
        >
            <div class="card shadow rounded-4" style="width: 100%; max-width: 400px; background: #fff;">
                <div class="card-header text-center bg-white border-0 pb-0">
                    <h4 class="fw-bold text-primary mb-0">Service Type</h4>
                </div>
                <div class="card-body py-4 d-flex flex-column justify-content-center align-items-center">
                    <div class="row w-100 g-3">
                        <div class="col-6 d-flex justify-content-center">
                            <button data-info="engine" class="btn btn-outline-danger serv_type shadow-sm car_btn w-100 h-100 rounded-3">
                                <i class="fa fa-2x fa-toolbox mb-2"></i><br>
                                <span class="fw-semibold">Engine</span>
                            </button>
                        </div>
                        <div class="col-6 d-flex justify-content-center">
                            <button data-info="interior" class="btn btn-outline-secondary serv_type shadow-sm car_btn w-100 h-100 rounded-3">
                                <i class="fa fa-2x fa-door-open mb-2"></i><br>
                                <span class="fw-semibold">Interior</span>
                            </button>
                        </div>
                        <div class="col-6 d-flex justify-content-center">
                            <button data-info="exterior" class="btn btn-outline-info serv_type shadow-sm car_btn w-100 h-100 rounded-3">
                                <i class="fa fa-2x fa-door-closed mb-2"></i><br>
                                <span class="fw-semibold">Exterior</span>
                            </button>
                        </div>
                        <div class="col-6 d-flex justify-content-center">
                            <button data-info="others" class="btn btn-outline-primary serv_type shadow-sm car_btn w-100 h-100 rounded-3">
                                <i class="fa fa-2x fa-truck-pickup mb-2"></i><br>
                                <span class="fw-semibold">Others</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>


        <div id="fuel_type" class="d-flex justify-content-center align-items-center" style="min-height: 100vh; width: 100vw;">
            <div class="card w-100" style="max-width: 400px;">
                <div class="card-header text-center"><strong class="card-title">Fuel</strong></div>
                <div class="card-body py-2 d-flex flex-column justify-content-center align-items-center">
                    <div class="row w-100 d-flex justify-content-center flex-wrap mb-5">
                        <div class="col-12 mb-4 d-flex justify-content-center">
                            <button data-info="petrol" class="btn btn-light fuel_type shadow-sm car_btn w-75">
                                <i class="fa fa-2x text-info fa-gas-pump"></i><br>
                                <small>Petrol</small>
                            </button>
                        </div>

                        <div class="col-12 mb-4 d-flex justify-content-center">
                            <button data-info="disel" class="btn btn-light fuel_type shadow-sm car_btn w-75">
                                <i class="fa fa-2x fa-gas-pump"></i><br>
                                <small>Disel</small>
                            </button>
                        </div>

                        <div class="col-12 d-flex justify-content-center">
                            <button data-info="gas" class="btn btn-light fuel_type shadow-sm car_btn w-75">
                                <i class="fa fa-2x text-danger fa-gas-pump"></i><br>
                                <small>Gas</small>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>




        <div id="other_details" class="container d-flex flex-column align-items-center justify-content-center my-5" style="max-width: 600px;">
            <div class="card shadow rounded-4 w-100 mb-4" style="background: #f9fbfd;">
                <div class="card-body px-4 py-4">
                    <h4 class="mb-3 text-center text-info fw-bold">
                        <i class="fa fa-user-circle me-1"></i>Customer Details
                    </h4>
                    <div class="mb-3">
                        <label for="company_name" class="form-label text-secondary fw-semibold">Organization</label>
                        <input type="text" id="company_name" class="form-control rounded-3 py-2" placeholder="Company name or individual name">
                    </div>
                    <div class="mb-3">
                        <label for="driver_name" class="form-label text-secondary fw-semibold">Driver Name</label>
                        <input type="text" id="driver_name" class="form-control rounded-3 py-2" placeholder="e.g. John Doe">
                    </div>
                    <div class="mb-3">
                        <label for="driver_phone" class="form-label text-secondary fw-semibold">Driver's Contact</label>
                        <input type="tel" id="driver_phone" class="form-control rounded-3 py-2" placeholder="Phone number">
                    </div>
                </div>
            </div>

            <div class="card shadow rounded-4 w-100 mb-4" style="background: #f9fbfd;">
                <div class="card-body px-4 py-4">
                    <h4 class="mb-3 text-center text-info fw-bold">
                        <i class="fa fa-car me-1"></i>Car Details
                    </h4>
                    <div class="mb-3">
                        <label for="car_brand" class="form-label text-secondary fw-semibold">Brand</label>
                        <select id="car_brand" class="form-select rounded-3 py-2">
                            <option value="" selected disabled>Select brand</option>
                            <option value="toyota">Toyota</option>
                            <option value="nissan">Nissan</option>
                            <option value="proton">Proton</option>
                            <option value="benz">Benz</option>
                            <option value="others">Others</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="car_model" class="form-label text-secondary fw-semibold">Model</label>
                        <input type="text" id="car_model" class="form-control rounded-3 py-2" placeholder="Car model">
                    </div>
                    <div class="mb-3">
                        <label for="reg_no" class="form-label text-secondary fw-semibold">Reg. No.</label>
                        <input type="text" id="reg_no" class="form-control rounded-3 py-2" placeholder="Registration number">
                    </div>
                </div>
            </div>

            <div class="card shadow rounded-4 w-100 mb-4" style="background: #f9fbfd;">
                <div class="card-body px-4 py-4">
                    <h4 class="mb-3 text-center text-info fw-bold">
                        <i class="fa fa-exclamation-circle me-1"></i>Problem
                    </h4>
                    <div class="mb-3">
                        <label for="problem" class="form-label text-secondary fw-semibold">Describe Issue</label>
                        <textarea id="problem" class="form-control rounded-3 py-2" rows="4" placeholder="Describe the issue..."></textarea>
                    </div>
                </div>
            </div>
        </div>
    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-12 d-flex justify-content-center">
                <button id="submit" class="btn btn-success px-5 py-3 fw-bold rounded-pill shadow" style="font-size: 1.25rem; letter-spacing: 1px; transition: background 0.2s;">
                    <i class="fa fa-paper-plane me-2"></i>SUBMIT
                </button>
            </div>
        </div>
    </div>

    </div>


    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Details</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="confirmSubmit">Confirm</button>
                </div>
            </div>
        </div>
    </div>


    <script>
        var allFilesSelected = true;
        $(document).ready(function(){
            $('.car_class').click(function(){
                $('.car_class').removeClass('active')
                $('.car_class').removeClass('btn-success')
                $(this).addClass('active')
                $(this).removeClass('btn-light')
                $(this).addClass('btn-success')
                location.href = '#service_type'
            })

            $('.serv_type').click(function(){
                $('.serv_type').removeClass('active')
                $('.serv_type').removeClass('btn-success')
                $(this).addClass('active')
                $(this).removeClass('btn-light')
                $(this).addClass('btn-success')
                location.href = '#fuel_type'

            })

            $('.fuel_type').click(function(){
                $('.fuel_type').removeClass('active')
                $('.fuel_type').removeClass('btn-success')
                $(this).addClass('active')
                $(this).removeClass('btn-light')
                $(this).addClass('btn-success')
                location.href = '#other_details'
            })

            $('#submit').click(function(){
                // Get selected values
                let carType = $('.car_class.active').data('info');
                let serviceType = $('.serv_type.active').data('info');
                let fuelType = $('.fuel_type.active').data('info');

                // Get form values
                let companyName = $('#company_name').val();
                let driverName = $('#driver_name').val();
                let driverPhone = $('#driver_phone').val();
                let carBrand = $('#car_brand').val();
                let carModel = $('#car_model').val();
                let regNo = $('#reg_no').val();
                let problem = $('#problem').val();

                let is_date = false;
                if(carType == undefined){
                    kasa.error('Please select car type')
                }

                if (serviceType == undefined) {
                    kasa.error('Please select service type')
                    return;
                }

                if (fuelType == undefined) {
                    kasa.error('Please select fuel type')
                    return;
                }

                let ids = ['company_name','driver_name','driver_phone','car_brand','car_model','reg_no','problem']
                if(anton.validateInputs(ids)){
                    // Populate modal
                    let ht = `
                        <p><strong>Car Type:</strong> ${carType}</p>
                        <p><strong>Service Type:</strong> ${serviceType}</p>
                        <p><strong>Fuel Type:</strong> ${fuelType}</p>
                        <p><strong>Company:</strong> ${companyName}</p>
                        <p><strong>Driver:</strong> ${driverName}</p>
                        <p><strong>Phone:</strong> ${driverPhone}</p>
                        <p><strong>Brand:</strong> ${carBrand}</p>
                        <p><strong>Model:</strong> ${carModel}</p>
                        <p><strong>Reg No:</strong> ${regNo}</p>
                        <p><strong>Problem:</strong> ${problem}</p>
                    `

                    // Show modal
                    amodal.setBodyHtml(ht)
                    let payload = {
                        module:'job_request',
                        data:anton.Inputs(ids)
                    }
                    payload['data']['fuel_type'] = fuelType
                    payload['data']['service_type'] = serviceType
                    payload['data']['car_type'] = carType
                    console.table(payload)
                    amodal.setFooterHtml(`
                                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                                            <button type="button" id="confirmSubmit" class="btn btn-success">Submit</button>
                    `)
                    amodal.show()

                    $('#confirmSubmit').click(async function () {
                        loader.show('Requesting Job Card...')
                        await api.v2('PUT', payload, '/cmms/api/').then(res => {
                            if (anton.IsRequest(res)) {
                                kasa.confirm('Job Card Submitted Successfully',1,`/cmms/servcing/track/${res.message}/`)
                                loader.hide()

                            } else {
                                kasa.response(res)
                                loader.hide()
                            }
                        }).catch(err => {
                            kasa.error('Something went wrong')
                            loader.hide()
                        })
                    })
                } else {
                    kasa.error('Please fill all required fields')
                }


            })
            // Get today's date
            document.getElementById('entry_date').value = new Date().toISOString().split('T')[0];
            $('#add_img_line').click(function(){
                $('#images_que').prepend(`<input type="file" name="file[]" class="form-control">
                                <hr>`);
            });

            $('#save_jc').click(function(){
                let ids = ['company','driver','contact','brand','model','car_number','report','mypk','entry_date'];
                // Reset `allFilesSelected` before validation
                let allFilesSelected = true;

                $('input[name="file[]"]').each(function() {
                    if ($(this).val() === '') {
                        allFilesSelected = false;
                        return false;  // Break the loop
                    }
                });



                if(anton.validateInputs(ids) || !allFilesSelected){
                    $('#save_jc').prop('disabled',true)
                    let payload = {
                        module:'save_job_card',
                        data:anton.Inputs(ids)
                    }


                    let save = api.call('PUT',payload,'/cmms/api/');
                    console.table(save)
                    if(anton.IsRequest(save)){
                        let saved_id = save.message;
                        $('#job_id').val(saved_id);
                        $('#images_que').submit();
                        kasa.info('Done')
                    } else {
                        kasa.response(save)
                        $('#save_jc').prop('disabled',false)
                    }
                }

            });
        });
    </script>
{% endblock %}
