{% extends 'blog/base.html' %}
{% load static %}

{% block body %}

<div class="card h-100 w-100">

    <div class="card-header">
        <div class="d-flex flex-wrap">
            <div class="w-25">
                <input type="text" placeholder="Title" autocomplete="off" required id="title" name="page_title"
                    class="form-control rounded-0 border-danger">
            </div>
            <div class="w-25">
                <div class="input-group">
                    <div class="input-group-prepend bg-light border-0">
                        <span class="input-group-text bg-light border-0 text-danger">Meta</span>
                    </div>
                    <input type="text" placeholder="Tags" autocomplete="off" required id="tags" name="tags"
                        class="form-control rounded-0 border-danger">
                    </select>
                </div>
            </div>
            <form class="w-25 pl-2" id="upload_blog_image_form" action="/blog/upload-image/" method="post"
                enctype="multipart/form-data">
                <input type="hidden" name="uni" id="uni" value="">
                <input type="file" required class="form-control rounded-0" accept="image/jpeg" name="post_img">
            </form>
            <div class="w-25 d-flex flex-wrap justify-content-end">
                <button type="button" onclick="blog.saveArticle()"
                    class="btn btn-success rounded-0 h-fit">Publish</button>

            </div>
        </div>
    </div>
    <div class="card-body p-2">
        <textarea name="article_desc" id="article_desc" class="tinymce-editor">
            </textarea>

    </div>

</div>



{% endblock %}
